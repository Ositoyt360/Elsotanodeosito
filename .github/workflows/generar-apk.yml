name: Generar y Actualizar APK de El Sótano de Osito

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'El-Sotano-de-Osito.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 17 para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Empaquetar WebApp completa con Auto-Actualización OTA desde GitHub en APK nativo
        run: |
          mkdir -p android-build/www
          cp -r index.html perfil.html moderador.html moderator.html manifest.json sw.js service-worker.js site-settings.json *.js *.css *.png *.svg *.mp3 *.mp4 fondos claude-1000-original android-build/www/ 2>/dev/null || true
          cd android-build
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "El Sotano de Osito" "com.ositoyt360.elsotanodeosito" --web-dir www
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ositoyt360.elsotanodeosito",
            "appName": "El Sótano de Osito",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "allowNavigation": [
                "*.github.com",
                "*.githubusercontent.com",
                "*.googleapis.com",
                "*.firebaseio.com",
                "*.youtube.com"
              ]
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../El-Sotano-de-Osito.apk

      - name: Guardar El-Sotano-de-Osito.apk actualizado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f El-Sotano-de-Osito.apk
          git diff --staged --quiet || (git commit -m "chore(apk): actualizar El-Sotano-de-Osito.apk automáticamente [skip ci]" && git push)

      - name: Publicar APK en GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "El Sótano de Osito — APK Auto-Actualizable (Última Versión)"
          body: "APK oficial para Android de El Sótano de Osito con motor adaptativo 60Hz/90Hz/120Hz, optimización en carga/segundo plano y auto-actualización OTA directa desde GitHub."
          prerelease: false
          files: |
            El-Sotano-de-Osito.apk
            El-Sotano-de-Osito-App.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir archivo El-Sotano-de-Osito.apk como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: El-Sotano-de-Osito-APK
          path: |
            El-Sotano-de-Osito.apk
            El-Sotano-de-Osito-App.html
          retention-days: 90
