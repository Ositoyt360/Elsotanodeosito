<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#050711">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="El Sótano de Osito">
    <title>El Sótano de Osito — App Auto-Actualizable (60Hz / 120Hz)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: #050711;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        #app-frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #050711;
            z-index: 1;
        }
    </style>
</head>
<body>
    <iframe id="app-frame" allow="autoplay; microphone; clipboard-write; fullscreen" allowfullscreen></iframe>

    <script>
        (function () {
            var GITHUB_REPO = 'Ositoyt360/Elsotanodeosito';
            var GITHUB_COMMITS_API = 'https://api.github.com/repos/' + GITHUB_REPO + '/commits?per_page=1';
            var LIVE_APP_URL = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
                ? window.location.origin
                : 'https://elsotanodeosito.onrender.com';

            var frame = document.getElementById('app-frame');
            var lastCommitSha = localStorage.getItem('osito_apk_commit_sha') || '';

            function buildAppUrl(sha) {
                var sep = LIVE_APP_URL.indexOf('?') === -1 ? '?' : '&';
                return LIVE_APP_URL + sep + 'app=1&v=' + encodeURIComponent(sha || Date.now());
            }

            // Carga directa e instantánea sin pantallas de carga intermedias
            frame.src = buildAppUrl(lastCommitSha || 'init');

            async function checkGithubUpdates() {
                try {
                    var res = await fetch(GITHUB_COMMITS_API, {
                        method: 'GET',
                        headers: { 'Accept': 'application/vnd.github.v3+json' },
                        cache: 'no-store'
                    });
                    if (!res.ok) return;
                    var data = await res.json();
                    var latestSha = Array.isArray(data) && data[0] && data[0].sha ? String(data[0].sha) : '';
                    if (!latestSha) return;

                    if (!lastCommitSha) {
                        lastCommitSha = latestSha;
                        localStorage.setItem('osito_apk_commit_sha', latestSha);
                        return;
                    }

                    if (latestSha !== lastCommitSha) {
                        lastCommitSha = latestSha;
                        localStorage.setItem('osito_apk_commit_sha', latestSha);
                        frame.src = buildAppUrl(latestSha);
                    }
                } catch (_) {}
            }

            checkGithubUpdates();
            setInterval(checkGithubUpdates, 45000);
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) checkGithubUpdates();
            });
            window.addEventListener('online', checkGithubUpdates);
        })();
    </script>
</body>
</html>
