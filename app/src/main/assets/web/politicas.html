<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Políticas | El Sótano de Osito</title><style>body{margin:0;padding:20px;min-height:100vh;color:#f3fff7;font:16px/1.65 system-ui,sans-serif;background:radial-gradient(circle at 10% 5%,rgba(88,255,154,.15),transparent 24rem),#030806}main{max-width:850px;margin:auto;padding:clamp(22px,6vw,48px);border:1px solid rgba(88,255,154,.28);border-radius:22px;background:rgba(10,24,18,.93)}h1,h2{color:#58ff9a}button{border:1px solid rgba(88,255,154,.42);border-radius:10px;padding:9px 12px;color:#eafff0;background:#071d12;font:inherit;font-weight:700;cursor:pointer}.nav{display:flex;gap:7px;overflow:auto}.nav button{white-space:nowrap}.nav button[aria-current=true]{background:rgba(88,255,154,.2)}</style></head><body><main><p>🐻 <strong>Cubit te acompaña</strong></p><button type="button" onclick="history.length>1?history.back():location.replace('index.html')">← Regresar</button><h1>Políticas y privacidad</h1><p>Versión 1.0 — 15 de octubre de 2026</p><div class="nav" id="nav"></div><article id="content"></article></main><script>const D=[['privacidad','Política de privacidad','El Sótano de Osito puede tratar correo, perfil, foto cargada voluntariamente, mensajes, conversaciones de IA y preferencias locales. La autenticación y los datos se integran con Firebase. El titular debe completar contacto, plazos de conservación y base jurídica antes de publicar una versión definitiva.'],['terminos','Términos y condiciones','Usa el servicio de forma lícita y respetuosa. Protege tus credenciales y no accedas a datos o funciones de otras personas sin autorización.'],['almacenamiento','Cookies y almacenamiento local','El navegador puede conservar sesión y preferencias. Borrar esos datos puede cerrar la sesión o restablecer opciones.'],['comunidad','Normas de comunidad','No publiques acoso, amenazas, odio, spam, enlaces maliciosos, datos de terceros sin permiso ni contenido ilegal.'],['ia','Uso de funciones de inteligencia artificial','Las respuestas pueden ser erróneas y no sustituyen asesoría profesional. No envíes secretos ni datos sensibles de terceros.'],['eliminacion','Eliminación de cuentas y datos','La eliminación debe ser solo para la cuenta propia. Las copias de seguridad y registros legales o de seguridad pueden tener límites de retención.'],['seguridad','Seguridad, limitaciones y contacto','El proyecto usa autenticación y reglas de Firebase; ningún sistema garantiza seguridad absoluta. El titular debe completar un contacto verificable.'],['contenido','Contenido compartido e información','Eres responsable de lo que publicas. Los mensajes pueden mostrarse a la comunidad y procesarse para sincronización y prevención de abusos.']];let a=D[0],n=document.getElementById('nav'),c=document.getElementById('content');function r(x){a=x;n.innerHTML=D.map(d=>`<button data-i="${d[0]}" aria-current="${d===x}">${d[1]}</button>`).join('');c.innerHTML=`<h2>${x[1]}</h2><p>${x[2]}</p><button id="read">▶ Escuchar este documento</button> <button id="stop">■ Detener</button>`;speechSynthesis.cancel()}n.onclick=e=>{let b=e.target.closest('[data-i]');if(b)r(D.find(x=>x[0]===b.dataset.i))};c.onclick=e=>{if(e.target.id==='stop')speechSynthesis.cancel();if(e.target.id==='read'){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(c.innerText);u.lang='es-419';speechSynthesis.speak(u)}};addEventListener('pagehide',()=>speechSynthesis.cancel());r(a)</script></body></html>
