<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06110c">
  <title>Políticas | El Sótano de Osito</title>
  <style>
    :root{color-scheme:dark;--green:#58ff9a;--ink:#07100d;--card:rgba(10,24,18,.91);--muted:#c4d4ca}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:#f3fff7;font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 5%,rgba(88,255,154,.15),transparent 24rem),radial-gradient(circle at 90% 10%,rgba(0,220,255,.12),transparent 28rem),#030806;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.45;background-image:linear-gradient(rgba(88,255,154,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(88,255,154,.1) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(#000,transparent 78%);animation:grid 20s linear infinite}@keyframes grid{to{background-position:0 160px,160px 0}}.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:24px 0 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 0}.brand{display:flex;align-items:center;gap:12px;font-weight:850;color:var(--green)}.cubit{width:45px;height:45px;display:grid;place-items:center;border:1px solid rgba(88,255,154,.48);border-radius:15px;background:linear-gradient(145deg,#654dff,#58ff9a);font-size:25px;box-shadow:0 0 26px rgba(88,255,154,.25)}button{font:inherit}.back,.read-controls button{border:1px solid rgba(88,255,154,.42);border-radius:12px;padding:10px 14px;color:#eafff0;background:rgba(7,29,18,.88);font-weight:750;cursor:pointer}.back:hover,.read-controls button:hover{background:rgba(88,255,154,.18)}.hero,.layout{border:1px solid rgba(88,255,154,.22);border-radius:22px;background:var(--card);box-shadow:0 26px 70px rgba(0,0,0,.38);backdrop-filter:blur(12px)}.hero{padding:clamp(25px,5vw,54px);margin-bottom:18px}.eyebrow{margin:0;color:var(--green);font-size:.78rem;font-weight:850;letter-spacing:.13em}.hero h1{margin:.35rem 0 .55rem;font-size:clamp(2rem,6vw,3.7rem);line-height:1.04}.hero p{max-width:760px;margin:0;color:var(--muted)}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);overflow:hidden}.nav{padding:18px;border-right:1px solid rgba(255,255,255,.08);align-self:start;position:sticky;top:0}.nav button{width:100%;display:block;padding:10px 11px;border:1px solid transparent;border-radius:10px;text-align:left;color:#d5e6da;background:transparent;cursor:pointer}.nav button:hover,.nav button[aria-current="true"]{color:#fff;border-color:rgba(88,255,154,.35);background:rgba(88,255,154,.1)}main{min-width:0;padding:clamp(24px,4vw,52px)}main h2{margin:0;color:var(--green);font-size:clamp(1.55rem,4vw,2.35rem);line-height:1.15}main h3{margin:30px 0 7px;color:#b3ffcf;font-size:1.08rem}main p{color:#d5e1d8}.version{margin:6px 0 24px;color:#a9c2b0;font-size:.9rem}.read-controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px;padding:12px;border-radius:15px;border:1px solid rgba(88,255,154,.16);background:rgba(0,0,0,.17)}.read-status{flex-basis:100%;margin:0;color:#a9c2b0;font-size:.88rem}@media(max-width:760px){.shell{width:min(100% - 20px,680px);padding-top:10px}.top{padding:10px 0}.layout{grid-template-columns:1fr}.nav{position:relative;display:flex;overflow:auto;gap:7px;padding:10px;border-right:0;border-bottom:1px solid rgba(255,255,255,.08)}.nav button{width:auto;white-space:nowrap}.hero{padding:25px 20px}.back{padding:9px 11px;font-size:.88rem}}@media(prefers-reduced-motion:reduce){body:before{animation:none}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top"><div class="brand"><span class="cubit" aria-hidden="true">🐻</span><span>Cubit te acompaña</span></div><button class="back" type="button" onclick="history.length > 1 ? history.back() : location.replace('index.html')">← Regresar</button></header>
    <section class="hero"><p class="eyebrow">EL SÓTANO DE OSITO · DOCUMENTOS LEGALES</p><h1>Políticas y privacidad</h1><p>Consulta los documentos sin salir de la experiencia de El Sótano de Osito. Esta vista se abre por separado para facilitar la lectura en teléfono.</p></section>
    <div class="layout"><nav class="nav" aria-label="Documentos legales" id="legal-nav"></nav><main id="content" tabindex="-1"></main></div>
  </div>
  <script>
    const docs=[
      ['privacidad','Política de privacidad',[['Alcance','Esta política describe el tratamiento de información dentro de El Sótano de Osito para la cuenta, el perfil, el chat en vivo, las conversaciones con IA y las funciones que la persona elige usar.'],['Información usada','El proyecto puede manejar correo de la cuenta, nombre visible, foto cargada voluntariamente, selección de perfil, mensajes del chat, conversaciones de IA y preferencias locales necesarias para la sesión y la interfaz.'],['Almacenamiento','La autenticación y los datos se integran con Firebase. El perfil se guarda en users; las conversaciones de IA se asocian a la cuenta y el navegador conserva preferencias y datos de sesión.'],['Revisión pendiente','El titular debe completar el contacto, los plazos de conservación y la base jurídica aplicable antes de publicar una versión definitiva. Esta pantalla no sustituye una revisión legal profesional.']]],
      ['terminos','Términos y condiciones',[['Uso del servicio','Usa el servicio de forma lícita, respetuosa y de acuerdo con estas reglas. No intentes acceder a cuentas, datos o funciones de otras personas.'],['Cuenta','La persona es responsable de cuidar sus credenciales y de la actividad realizada desde su cuenta.'],['Cambios','Cuando un cambio requiera una nueva aceptación, la aplicación debe mostrar la versión correspondiente antes de habilitar las funciones afectadas.']]],
      ['almacenamiento','Cookies y almacenamiento local',[['Qué se utiliza','La aplicación usa el almacenamiento local del navegador para recordar sesión, ajustes de interfaz, preferencias de rendimiento y otras opciones necesarias para continuar entre visitas.'],['Control','Puedes borrar el almacenamiento del sitio desde los ajustes del navegador. Esto puede cerrar la sesión o restablecer preferencias.']]],
      ['comunidad','Normas de comunidad',[['Convivencia','No publiques acoso, amenazas, odio, spam, enlaces maliciosos, datos personales de terceros sin permiso, suplantaciones ni contenido ilegal.'],['Moderación','El contenido puede moderarse para proteger a la comunidad y operar el servicio. Esto no reemplaza los canales de emergencia o las autoridades cuando exista un riesgo inmediato.']]],
      ['ia','Uso de funciones de inteligencia artificial',[['Limitaciones','Las respuestas de IA pueden ser erróneas, incompletas o inadecuadas para un caso particular. No sustituyen asesoría médica, legal, financiera ni de emergencia.'],['Información enviada','No envíes secretos, contraseñas, datos de salud ni información sensible de otras personas. El texto, imágenes o audio pueden procesarse por los servicios configurados por el titular.']]],
      ['eliminacion','Eliminación de cuentas y datos',[['Solicitud','La eliminación debe tramitarse solamente para la cuenta propia. Antes de afirmar que es completa, el flujo debe verificarse contra Firebase Authentication, Firestore, almacenamiento y cualquier backend usado.'],['Límites','Las copias de seguridad, registros de seguridad o datos que deban conservarse legalmente no necesariamente desaparecen de forma inmediata.']]],
      ['seguridad','Seguridad, limitaciones y contacto',[['Seguridad','El proyecto usa autenticación y reglas de acceso de Firebase. Ningún sistema puede prometer seguridad absoluta; usa una contraseña única y avisa al responsable ante una vulnerabilidad.'],['Contacto','El titular debe completar aquí un correo o canal de contacto verificable, la identidad del responsable y la jurisdicción aplicable.']]],
      ['contenido','Contenido compartido e información',[['Responsabilidad','Eres responsable de lo que publicas y solo debes compartir material que tengas derecho a usar.'],['Visibilidad','Los mensajes del chat pueden ser vistos por otras personas de la comunidad. Piensa antes de publicar datos personales.'],['Tratamiento','El contenido puede almacenarse y procesarse para mostrarlo, sincronizarlo, prevenir abusos y operar las funciones solicitadas.']]]
    ];let active=docs[0];const nav=document.getElementById('legal-nav'),content=document.getElementById('content');function stop(){speechSynthesis&&speechSynthesis.cancel()}function render(doc){active=doc;nav.innerHTML=docs.map(x=>`<button type="button" data-id="${x[0]}" aria-current="${x===doc}">${x[1]}</button>`).join('');content.innerHTML=`<h2>${doc[1]}</h2><p class="version">Versión 1.0 — 15 de octubre de 2026</p><div class="read-controls"><button type="button" id="read">▶ Escuchar este documento</button><button type="button" id="pause">⏸ Pausar</button><button type="button" id="resume">↻ Reanudar</button><button type="button" id="stop">■ Detener</button><p class="read-status" id="status">La lectura usa la voz disponible en este navegador.</p></div>${doc[2].map(x=>`<section><h3>${x[0]}</h3><p>${x[1]}</p></section>`).join('')}`;stop();content.focus()}nav.addEventListener('click',e=>{let b=e.target.closest('[data-id]');if(b)render(docs.find(x=>x[0]===b.dataset.id))});content.addEventListener('click',e=>{let s=document.getElementById('status');if(e.target.id==='stop'){stop();s.textContent='Lectura detenida.'}if(e.target.id==='pause'){speechSynthesis.pause();s.textContent='Lectura pausada.'}if(e.target.id==='resume'){speechSynthesis.resume();s.textContent='Lectura reanudada.'}if(e.target.id==='read'){stop();let u=new SpeechSynthesisUtterance(content.innerText);u.lang='es-419';u.onend=()=>s.textContent='La lectura terminó.';u.onerror=()=>s.textContent='No se pudo completar la lectura en este navegador.';speechSynthesis.speak(u);s.textContent='Leyendo: '+active[1]+'.'}});addEventListener('pagehide',stop);render(active);
  </script>
</body>
</html>
