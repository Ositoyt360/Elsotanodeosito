services:
  - type: web
    name: el-sotano-de-osito
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/ia/estado
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # la pones tú en el panel de Render (clave de Google AI Studio)
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_RESPALDO
        value: gemini-3.8-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: IA_MAX_POR_DIA_TOTAL
        value: "500"
      - key: IA_ALLOWED_ORIGINS
        sync: false          # opcional: https://TUUSUARIO.github.io
